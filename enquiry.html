
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch and Seam tailoring</title>
    <link rel="stylesheet" href="CSS/Style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Stitch and Seam tailoring</h1>
        <p>quality tailoring. perfect fit</p>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="Home.html">home</a>
        <a href="about.html">about</a>
        <a href="services.html">services</a>
        <a href="booking.html">booking</a>
        <a href="contact.html">contact</a>
        <a href="enquiry.html">enquiry</a>
    </nav>

    <!-- Search bar -->
    <form class="search-form" action="search.html" method="get">
        <input
            type="search"
            name="q"
            placeholder="Search this website..."
            aria-label="Search this website"
            required
        >
        <button type="submit">Search</button>
    </form>

    <!-- Page introduction -->
    <section class="hero">
        <h1>Enquire Here</h1>
        <p>If you have a concern about us, please fill in this form.</p>
    </section>

    <!-- Enquiry Form -->
    <div class="contact-box">

        <h2>Send Us a Message</h2>

        <form id="enquiryForm" novalidate>

            <!-- Full name -->
            <div class="form-group">
                <label for="enquiryName">Full name</label>

                <input
                    type="text"
                    id="enquiryName"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <span class="error-message" id="enquiryNameError"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="enquiryEmail">Email address</label>

                <input
                    type="email"
                    id="enquiryEmail"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

                <span class="error-message" id="enquiryEmailError"></span>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="enquiryPhone">Phone number</label>

                <input
                    type="tel"
                    id="enquiryPhone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

                <span class="error-message" id="enquiryPhoneError"></span>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="enquiryMessage">Description</label>

                <textarea
                    id="enquiryMessage"
                    name="message"
                    placeholder="How can we help you?"
                    required
                ></textarea>

                <span class="error-message" id="enquiryMessageError"></span>
            </div>

            <!-- Submit button -->
            <button type="submit" class="button">
                Send Enquiry
            </button>

            <!-- Success message -->
            <p
                id="enquirySuccessMessage"
                class="success-message"
                aria-live="polite"
            ></p>

        </form>

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Stitch and Seam tailoring. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="javascript/script.js" defer></script>

</body>
</html>
